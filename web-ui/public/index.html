<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Microsoft Rewards</title>
  <style>
    :root{--bg:#0d1014;--surface:#15191f;--surface-2:#1c222a;--line:#303844;--text:#edf1f6;--muted:#9da8b7;--accent:#58a6ff;--accent-hover:#3182ce;--ok:#4ade80;--warn:#f5b942;--bad:#fb7185;--r:6px;--s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:24px;--s6:32px}
    *{box-sizing:border-box}html{color-scheme:dark}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 "Segoe UI",system-ui,sans-serif}button,input{font:inherit}button{cursor:pointer}.hidden{display:none!important}:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
    .kicker{color:var(--accent);font:11px Consolas,monospace;letter-spacing:.1em;text-transform:uppercase}h1{margin:var(--s1) 0 var(--s2);font-size:28px;line-height:1.15;letter-spacing:0}h2{margin:0 0 var(--s3);font-size:16px}.muted{color:var(--muted)}label{display:block;margin:var(--s4) 0 var(--s2);color:var(--muted);font:11px Consolas,monospace;letter-spacing:.08em;text-transform:uppercase}input{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:var(--r);background:var(--bg);color:var(--text)}
    .btn{min-height:38px;padding:8px 14px;border:1px solid var(--accent);border-radius:var(--r);background:var(--accent);color:#07111e;font-weight:700}.btn:hover{background:var(--accent-hover);color:white}.btn.secondary{border-color:var(--line);background:var(--surface-2);color:var(--text)}.btn.danger{border-color:var(--bad);background:transparent;color:var(--bad)}.btn:disabled{cursor:not-allowed;opacity:.5}
    .topbar{height:60px;display:flex;align-items:center;gap:var(--s4);padding:0 var(--s5);border-bottom:1px solid var(--line);background:var(--surface)}.brand{font-weight:700}.brand span{color:var(--accent)}.status{margin-left:auto;display:flex;align-items:center;gap:var(--s2);color:var(--muted);font:12px Consolas,monospace}.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}.dot.ok{background:var(--ok)}.dot.warn{background:var(--warn)}
    main{width:min(1120px,100%);margin:auto;padding:var(--s5)}.head{display:flex;align-items:end;justify-content:space-between;gap:var(--s4);margin-bottom:var(--s5)}.head p{margin:0}.actions{display:flex;gap:var(--s2)}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--s3);margin-bottom:var(--s4)}.metric{padding:var(--s4);border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}.metric small{color:var(--muted);font:11px Consolas,monospace;text-transform:uppercase;letter-spacing:.08em}.metric strong{display:block;margin-top:var(--s2);font:650 24px Consolas,monospace}
    .section{padding:var(--s4) 0;border-top:1px solid var(--line)}.form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:0 var(--s4)}.form-actions{display:flex;align-items:center;gap:var(--s3);margin-top:var(--s4)}.table{overflow:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}table{width:100%;border-collapse:collapse;min-width:700px}th,td{padding:11px 13px;border-bottom:1px solid var(--line);text-align:left}th{color:var(--muted);font:11px Consolas,monospace;text-transform:uppercase;letter-spacing:.08em}tbody tr:last-child td{border:0}.badge{display:inline-block;padding:3px 7px;border:1px solid var(--line);border-radius:999px;font:11px Consolas,monospace}.badge.ok{border-color:#287943;color:var(--ok)}.row-actions{display:flex;gap:var(--s2)}pre{height:300px;overflow:auto;margin:0;padding:var(--s4);border:1px solid var(--line);border-radius:var(--r);background:#090b0e;color:#c9d4e2;font:12px/1.6 Consolas,monospace;white-space:pre-wrap}.empty{padding:var(--s5);text-align:center;color:var(--muted)}
    @media(max-width:700px){.topbar{padding:0 var(--s4)}main{padding:var(--s4)}.head{align-items:flex-start;flex-direction:column}.metrics,.form-grid{grid-template-columns:1fr}.actions{width:100%}.actions .btn{flex:1}}
  </style>
</head>
<body>
  <section id="app">
    <header class="topbar"><div class="brand">Microsoft Rewards <span>/ Official Core</span></div><div class="status"><i id="dot" class="dot"></i><span id="statusText">CHECKING</span></div></header>
    <main>
      <div class="head"><div><div class="kicker">Docker Console</div><h1>积分任务</h1><p class="muted">GUI 只编排官方脚本，不修改登录、搜索或积分逻辑。</p></div><div class="actions"><button id="refresh" class="btn secondary">刷新</button><button id="stop" class="btn danger">暂停脚本</button><button id="run" class="btn">立即运行</button></div></div>
      <div class="metrics"><div class="metric"><small>Runner</small><strong id="runner">-</strong></div><div class="metric"><small>Accounts</small><strong id="count">-</strong></div><div class="metric"><small>Schedule</small><strong>07:00</strong></div></div>
      <section class="section"><h2>Microsoft 账号</h2><form id="accountForm"><div class="form-grid"><div><label for="email">邮箱</label><input id="email" type="email" autocomplete="username" required></div><div><label for="password">密码</label><input id="password" type="password" autocomplete="new-password" required></div><div><label for="totp">TOTP Secret（可选）</label><input id="totp" type="password" autocomplete="off"></div><div><label for="recovery">恢复邮箱（可选）</label><input id="recovery" type="email"></div><div><label for="geo">地区</label><input id="geo" value="auto"></div><div><label for="lang">语言</label><input id="lang" value="zh"></div></div><div class="form-actions"><button class="btn">保存账号</button><span id="accountMessage" class="muted"></span></div></form></section>
      <section class="section"><div class="table"><table><thead><tr><th>账号</th><th>地区 / 语言</th><th>凭据</th><th>Desktop Session</th><th>Mobile Session</th><th>操作</th></tr></thead><tbody id="rows"></tbody></table><div id="empty" class="empty hidden">尚未添加账号</div></div></section>
      <section class="section"><h2>官方运行日志</h2><pre id="log">暂无日志</pre></section>
    </main>
  </section>
  <script>
    async function api(url,options={}){const response=await fetch(url,options);const data=await response.json().catch(()=>({}));return{status:response.status,ok:response.ok,...data}}
    function badge(text,ok){const span=document.createElement('span');span.className=`badge ${ok?'ok':''}`;span.textContent=text;return span}
    let loading=false;
    async function load(){if(loading)return;loading=true;try{const data=await api('/api/state');document.getElementById('runner').textContent=data.running?'RUNNING':'IDLE';document.getElementById('count').textContent=data.accounts.length;document.getElementById('dot').className=`dot ${data.running?'warn':'ok'}`;document.getElementById('statusText').textContent=data.running?'RUNNING':'READY';document.getElementById('run').disabled=data.running;document.getElementById('stop').disabled=!data.running;document.getElementById('log').textContent=data.log||'暂无日志';const rows=document.getElementById('rows');rows.replaceChildren();document.getElementById('empty').classList.toggle('hidden',data.accounts.length>0);for(const account of data.accounts){const row=document.createElement('tr');for(const value of [account.email,`${account.geoLocale} / ${account.langCode}`]){const td=document.createElement('td');td.textContent=value;row.append(td)}const credentials=document.createElement('td');credentials.append(badge('PASSWORD',account.hasPassword),document.createTextNode(' '),badge('TOTP',account.hasTotp));row.append(credentials);for(const ready of [account.desktopSession,account.mobileSession]){const td=document.createElement('td');td.append(badge(ready?'READY':'MISSING',ready));row.append(td)}const action=document.createElement('td');const remove=document.createElement('button');remove.className='btn danger';remove.textContent='删除';remove.onclick=()=>removeAccount(account.email);action.append(remove);row.append(action);rows.append(row)}document.getElementById('log').scrollTop=document.getElementById('log').scrollHeight}finally{loading=false}}
    async function removeAccount(email){if(!confirm(`删除 ${email} 的账号配置？`))return;const result=await api(`/api/accounts/${encodeURIComponent(email)}`,{method:'DELETE'});if(!result.ok)return alert(result.error||'删除失败');load()}
    document.getElementById('accountForm').onsubmit=async event=>{event.preventDefault();const message=document.getElementById('accountMessage');message.textContent='保存中';const result=await api('/api/accounts',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:document.getElementById('email').value,password:document.getElementById('password').value,totpSecret:document.getElementById('totp').value,recoveryEmail:document.getElementById('recovery').value,geoLocale:document.getElementById('geo').value,langCode:document.getElementById('lang').value})});if(!result.ok){message.textContent=result.error;return}event.target.reset();document.getElementById('geo').value='auto';document.getElementById('lang').value='zh';message.textContent='已保存';load()};
    document.getElementById('run').onclick=async()=>{const result=await api('/api/run',{method:'POST'});if(!result.ok)return alert(result.error||'启动失败');setTimeout(load,500)};document.getElementById('stop').onclick=async()=>{const result=await api('/api/stop',{method:'POST'});if(!result.ok)return alert(result.error||'暂停失败');setTimeout(load,500)};document.getElementById('refresh').onclick=load;load();setInterval(load,3000);
  </script>
</body>
</html>
